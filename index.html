<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabs de Raulito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Diseño: estuche de guitarra. Madera de palosanto, trastes de latón, cuerdas de níquel, incrustaciones de nácar.
   Cabecera = diapasón con un acorde de La menor; listado en tarjetas agrupadas por inicial; modo práctica a pantalla completa. */
:root{
  --wood:#1B1310; --wood-2:#241913; --wood-3:#2F2119; --grain:#3B2A20;
  --ivory:#F4EADC; --dust:#B9A693; --brass:#E2A55A; --brass-2:#F2C487; --nickel:#CBCFD4; --nacre:#7CCAB9;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--wood);color:var(--ivory);font:16px/1.55 var(--body);overflow-x:clip;
  background-image:repeating-linear-gradient(92deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px), radial-gradient(1200px 600px at 80% -10%, rgba(226,165,90,.10), transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ---------- Cabecera / diapasón ---------- */
.hero{position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.hero .wrap{position:relative;z-index:2;padding-block:56px 30px;display:grid;gap:18px}
h1{font:400 clamp(3rem,10vw,7.2rem)/.86 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:11ch}
.lede{margin:0;max-width:52ch;color:var(--dust);font-size:1.08rem}
.counts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:6px 0 0;padding:0;list-style:none}
.counts li{display:grid}
.counts b{font:400 2rem/1 var(--display);color:var(--brass-2);font-variant-numeric:tabular-nums}
.counts span{font-size:.85rem;color:var(--dust)}
.fret{position:relative;z-index:1;height:150px;margin-top:6px}
.fret svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fret .str{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .fret .str{animation:pluck 1.6s cubic-bezier(.2,.7,.2,1) both}
  .fret .str:nth-of-type(2){animation-delay:.06s}.fret .str:nth-of-type(3){animation-delay:.12s}
  .fret .str:nth-of-type(4){animation-delay:.18s}.fret .str:nth-of-type(5){animation-delay:.24s}.fret .str:nth-of-type(6){animation-delay:.30s}
  .fret .dot{animation:glow 1.2s .5s ease-out both}
}
@keyframes pluck{0%{transform:scaleY(1)}8%{transform:translateY(-2.4px)}16%{transform:translateY(2px)}26%{transform:translateY(-1.4px)}38%{transform:translateY(1px)}52%{transform:translateY(-.5px)}70%,100%{transform:none}}
@keyframes glow{from{opacity:0;r:0}to{opacity:1}}

/* ---------- Barra de búsqueda fija ---------- */
.tools{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background .25s,box-shadow .25s,backdrop-filter .25s}
.tools.stuck{background:rgba(27,19,16,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--grain),0 10px 30px rgba(0,0,0,.35)}
.tools .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:12px}
.search{position:relative;flex:1 1 300px;min-width:0}
.search input{width:100%;font:500 1.05rem var(--body);color:var(--ivory);background:var(--wood-2);border:1px solid var(--grain);border-radius:999px;padding:13px 18px 13px 46px;transition:border-color .2s,background .2s}
.search input::placeholder{color:#8f7e6d}
.search input:focus{outline:none;border-color:var(--brass);background:var(--wood-3)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--brass);fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--grain);background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--dust);transition:all .2s}
.chip:hover{color:var(--ivory);border-color:#5a4434}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--wood)}
.chip .n{font-weight:500;opacity:.7;margin-left:5px}
.sort{background:var(--wood-2);color:var(--ivory);border:1px solid var(--grain);border-radius:999px;padding:9px 14px;font:600 .88rem var(--body)}

/* ---------- Artistas ---------- */
.artists{padding-block:22px 6px}
.artists h2,.sec h2{font:400 1.6rem/1.1 var(--display);margin:0 0 14px}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:var(--grain) transparent}
.strip button{all:unset;cursor:pointer;scroll-snap-align:start;display:grid;justify-items:center;gap:7px;width:76px;flex:none;text-align:center}
.strip .ring{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--grain);transition:background .2s,transform .2s}
.strip button:hover .ring{transform:translateY(-3px)}
.strip button[aria-pressed="true"] .ring{background:conic-gradient(from 200deg,var(--brass),var(--brass-2),var(--nacre),var(--brass))}
.strip .ring img,.strip .ring i{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--wood-3);font:400 1.2rem var(--display);font-style:normal;color:var(--brass-2);border:2px solid var(--wood)}
.strip .nm{font-size:.75rem;line-height:1.2;color:var(--dust);max-width:76px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip button[aria-pressed="true"] .nm{color:var(--ivory);font-weight:600}
.strip button:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:10px}

/* ---------- Canciones ---------- */
.sec{padding-block:18px 80px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{color:var(--dust);font-size:.92rem;margin:0}
.group{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px 28px;padding-top:26px;border-top:1px solid var(--grain);margin-top:26px;scroll-margin-top:90px}
.group:first-of-type{border-top:0;margin-top:6px}
.ahead{position:sticky;top:90px;align-self:start;display:grid;justify-items:start;gap:10px}
.ahead .av{width:96px;height:96px;font-size:2rem;box-shadow:0 0 0 3px var(--wood),0 0 0 4px var(--brass)}
.ahead h3{font:400 1.7rem/1.05 var(--display);margin:0;text-wrap:balance}
.ahead p{margin:0;color:var(--dust);font-size:.88rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.cards li{display:contents}
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-content:start;color:inherit;text-decoration:none;padding:14px 16px;border-radius:14px;background:linear-gradient(180deg,var(--wood-2),#20160f);border:1px solid var(--grain);cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .25s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#6b4f37;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.av{width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--wood-3);display:grid;place-items:center;font:400 1.15rem var(--display);color:var(--brass-2);box-shadow:0 0 0 2px var(--wood),0 0 0 3px var(--grain)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.res{border-radius:12px;color:var(--nacre)}
.av.res svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
.card h4{font:400 1.2rem/1.15 var(--display);margin:0;padding-right:34px;text-wrap:balance}
.card .by{color:var(--dust);font-size:.86rem;margin:2px 0 0}
.feats{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ft{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.04);color:var(--dust);border:1px solid var(--grain)}
.ft svg{width:11px;height:11px}
.ft.v svg{fill:#e2564a}.ft.t svg{fill:none;stroke:var(--nickel);stroke-width:2}
.ft.mine{background:rgba(226,165,90,.14);color:var(--brass-2);border-color:rgba(226,165,90,.35)}
.card .go{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:var(--wood);opacity:0;transform:scale(.8);transition:all .2s}
.card .go svg{width:12px;height:12px;fill:currentColor;margin-left:2px}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.empty{color:var(--dust);padding:40px 0;font-size:1.05rem}
footer{border-top:1px solid var(--grain);padding-block:28px 48px;color:var(--dust);font-size:.88rem}

@media (prefers-reduced-motion:no-preference){
  .card.in{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

/* ---------- Modo práctica ---------- */
.practice{position:fixed;inset:0;z-index:50;background:var(--wood);display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);--x:50%;--y:50%}
@media (prefers-reduced-motion:no-preference){
  .practice.opening{animation:reveal .55s cubic-bezier(.65,0,.25,1) both}
  .practice.closing{animation:reveal .4s cubic-bezier(.65,0,.25,1) reverse both}
}
@keyframes reveal{from{clip-path:circle(0 at var(--x) var(--y))}to{clip-path:circle(150% at var(--x) var(--y))}}
.pbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--wood-3),var(--wood-2));border-bottom:1px solid var(--grain)}
.pbar .av{width:40px;height:40px;font-size:.9rem}
.pbar h2{font:400 1.3rem/1.1 var(--display);margin:0}
.pbar .who{font-size:.85rem;color:var(--dust)}
.ttlbox{min-width:0;flex:1 1 180px}
.src{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{font:600 .82rem var(--body);border:1px solid var(--grain);background:var(--wood);color:var(--ivory);padding:7px 12px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pbtn:hover{border-color:#6b4f37}
.pbtn[aria-pressed="true"]{background:var(--brass);color:var(--wood);border-color:var(--brass)}
.pbtn.close{width:38px;height:38px;justify-content:center;padding:0;font-size:1.1rem}
.stage{position:relative;min-height:0;overflow:hidden;background:#fff}
.tabframe{width:100%;height:100%;border:0;display:block;background:#fff}
.ownview{height:100%;overflow:auto;background:var(--wood);padding:24px max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.ownview pre{margin:0;font:.95rem/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;white-space:pre;overflow-x:auto;padding:16px;background:var(--wood-2);border:1px solid var(--grain);border-radius:10px;color:var(--ivory)}
.capo{font-weight:600}.capo b{color:var(--brass-2)}
.note{color:var(--dust);max-width:65ch;margin:0}
.shapes{display:flex;flex-wrap:wrap;gap:16px}
.shape{display:grid;justify-items:center;gap:6px;font-size:.78rem;color:var(--dust)}
.shape svg{width:96px;height:118px}
.nolink{height:100%;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;color:var(--dust);background:var(--wood)}
.cta{font:700 .95rem var(--body);background:var(--brass);color:var(--wood);border:0;padding:11px 18px;border-radius:999px;text-decoration:none}
.pip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:var(--pip-w,320px);max-width:calc(100% - 28px);background:#000;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(226,165,90,.35);transition:width .3s cubic-bezier(.2,.8,.2,1)}
.pip.top{bottom:auto;top:14px}.pip.left{right:auto;left:max(14px,env(safe-area-inset-left,0px))}
.pip .vid{aspect-ratio:16/9;width:100%}
.pip iframe{width:100%;height:100%;border:0;display:block}
.pctl{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:6px;background:var(--wood-2)}
.pctl button{font:600 .72rem var(--body);border:1px solid var(--grain);background:var(--wood);color:var(--ivory);padding:4px 9px;border-radius:999px;cursor:pointer}
.pctl button[aria-pressed="true"]{background:var(--brass);color:var(--wood)}
.pctl .sp{flex:1}
.pip.min .vid{display:none}
.vctl{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;background:var(--wood-3);border-top:1px solid var(--grain);font:600 .72rem var(--body);color:var(--dust)}
.vctl[hidden]{display:none!important}
.vctl .lbl{margin-right:2px}
.vctl button{font:600 .72rem var(--body);border:1px solid var(--grain);background:var(--wood);color:var(--ivory);padding:4px 8px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.vctl button[aria-pressed="true"]{background:var(--brass);color:var(--wood);border-color:var(--brass)}
.vctl .sep{width:1px;height:16px;background:var(--grain);margin:0 4px}
.vctl .loopinfo{color:var(--brass-2);font-variant-numeric:tabular-nums;margin-left:2px}
.dice{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--brass);background:transparent;color:var(--brass-2);padding:8px 14px;border-radius:999px;cursor:pointer;font:700 .88rem var(--body);transition:background .2s,color .2s}
.dice:hover{background:var(--brass);color:var(--wood)}
.dice svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.dice svg circle{fill:currentColor;stroke:none}
@media (prefers-reduced-motion:no-preference){ .dice.roll svg{animation:roll .5s cubic-bezier(.3,.7,.3,1)} }
@keyframes roll{from{transform:rotate(-200deg) scale(.7)}to{transform:none}}
.novid{color:#ddd;font-size:.85rem;padding:14px;aspect-ratio:16/9;display:grid;place-content:center;text-align:center;gap:6px}

@media (max-width:760px){
  .hero .wrap{padding-block:40px 18px}
  .fret{height:96px}
  .group{grid-template-columns:minmax(0,1fr);gap:12px}
  .ahead{position:static;grid-template-columns:64px minmax(0,1fr);align-items:center;column-gap:14px}
  .ahead .av{width:64px;height:64px;font-size:1.3rem;grid-row:span 2}
  .ahead h3{font-size:1.35rem}
  .cards{grid-template-columns:minmax(0,1fr)}
  .pip{--pip-w:58vw}
  .pbar h2{font-size:1.05rem}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Tabs de Raulito</h1>
    <p class="lede">Las canciones que voy guardando para tocar con la guitarra. Elige una, abre los acordes en grande y deja el vídeo sonando en una esquina.</p>
    <ul class="counts" id="stats"></ul>
  </div>
  <div class="fret" aria-hidden="true" id="fret"></div>
</header>

<div class="tools" id="tools">
  <div class="wrap">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Busca una canción o un artista" autocomplete="off" aria-label="Buscar">
    </label>
    <div class="chips" role="group" aria-label="Filtros" id="chips"></div>
    <button class="dice" id="dice" title="Abre una canción al azar entre las que se ven en el listado"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/><circle cx="12" cy="12" r="1.5"/></svg>Sorpréndeme</button>
  </div>
</div>

<main>
  <section class="wrap artists" aria-label="Artistas">
    <h2>Artistas</h2>
    <div class="strip" id="artists"></div>
  </section>
  <section class="wrap sec">
    <div class="sechead"><h2 id="sectitle">Canciones</h2><p class="count" id="count" aria-live="polite"></p></div>
    <div id="list"></div>
  </section>
</main>

<div class="practice" id="practice" hidden role="dialog" aria-modal="true" aria-labelledby="p-title">
  <div class="pbar">
    <span id="p-av"></span>
    <div class="ttlbox"><h2 id="p-title"></h2><div class="who" id="p-who"></div></div>
    <div class="src" id="p-src" role="group" aria-label="Fuente de acordes"></div>
    <button class="pbtn" id="p-dice" title="Otra canción al azar">Otra al azar</button>
    <a class="pbtn" id="p-open" target="_blank" rel="noopener">Abrir en otra pestaña</a>
    <button class="pbtn close" id="p-close" aria-label="Volver al listado">✕</button>
  </div>
  <div class="stage">
    <div id="p-main" style="height:100%"></div>
    <div class="pip" id="pip">
      <div class="vid" id="p-vid"></div>
      <div class="pctl">
        <span id="p-vsel"></span><span class="sp"></span>
        <button id="pip-size">Tamaño</button>
        <button id="pip-move">Mover</button>
        <button id="pip-min" aria-pressed="false">Ocultar</button>
      </div>
      <div class="vctl" id="vctl" hidden>
        <span class="lbl">Velocidad</span>
        <button data-rate="0.5">0,5×</button><button data-rate="0.75">0,75×</button><button data-rate="1" aria-pressed="true">1×</button>
        <span class="sep"></span>
        <button id="v-back" title="Retroceder 5 segundos">−5 s</button>
        <span class="sep"></span>
        <button id="loop-a" title="Marca el inicio del bucle en el punto actual">Inicio</button>
        <button id="loop-b" title="Marca el final del bucle en el punto actual">Fin</button>
        <button id="loop-x" title="Quitar el bucle" hidden>Quitar bucle</button>
        <span class="loopinfo" id="loop-info"></span>
      </div>
    </div>
  </div>
</div>

<footer class="wrap">Enlaces comprobados el 23 de octubre de 2026.</footer>

const AVALIAS = {'Marea y Carlos Chaouen':'Marea','Zahara y Love of Lesbian':'Zahara'};
const avOf = a => AV[a] || AV[AVALIAS[a]] || null;
const initials = a => a.replace(/^(El|La|Los|Las)\s+/,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const $ = s => document.querySelector(s);
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMBEDDABLE = /(^|\.)(lacuerda\.net|acordesweb\.com|cifraclub\.com)$/;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e) { return ''; } };
const ytId = u => { const m = u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m && /youtu/.test(u) ? m[1] : null; };

DATA.forEach((g,i) => {
  g.i = i;
  g.videos = g.links.filter(l => ytId(l.u));
  g.tabs = g.links.filter(l => l.k==='tab' || l.k==='web');
  g.mine = !!(g.own && (g.own.chords||g.own.tab||g.own.shapes||g.own.capo));
  g.slug = norm(`${g.a} ${g.s}`).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  g.hay = norm([g.a,g.s,g.links.map(l=>l.n).join(' '),g.own?Object.values(g.own).flat().join(' '):''].join(' '));
});
const songs = DATA.filter(g => g.t==='cancion');
const artists = {}; songs.forEach(g => { if (g.a) artists[g.a] = (artists[g.a]||0)+1; });
$('#stats').innerHTML = [[songs.length,'canciones'],[Object.keys(artists).length,'artistas'],[DATA.filter(g=>g.mine).length,'con mis acordes']]
  .map(([n,t])=>`<li><b>${n}</b><span>${t}</span></li>`).join('');

/* Diapasón: trastes, cuerdas, incrustaciones y un La menor */
(function fret(){
  const W=1400,H=150,frets=15,x0=36,step=(W-36)/ (frets-1), sy=[22,43,64,86,107,128];
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="wd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a1c15"/><stop offset="1" stop-color="#1b1310"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#wd)"/>`;
  for(let f=0;f<frets;f++){ const x=x0+f*step; s+=`<rect x="${x}" y="8" width="${f===0?9:4}" height="${H-16}" fill="${f===0?'#e9dcc6':'#b98b4f'}" opacity="${f===0?.9:.75}"/>`; }
  [3,5,7,9].forEach(f=>{ const x=x0+(f-.5)*step; s+=`<circle cx="${x}" cy="75" r="7" fill="#7CCAB9" opacity=".55"/>`; });
  [[12,54],[12,97]].forEach(([f,y])=>{ const x=x0+(f-.5)*step; s+=`<circle cx="${x}" cy="${y}" r="7" fill="#7CCAB9" opacity=".55"/>`; });
  sy.forEach((y,i)=>{ const w=[1,1.3,1.7,2.2,2.8,3.4][i]; s+=`<g class="str"><rect x="0" y="${y-w/2}" width="${W}" height="${w}" fill="#cbcfd4" opacity=".85"/></g>`; });
  // La menor (Am): cuerda 2 traste 1, cuerdas 4 y 3 traste 2
  [[1,1],[3,2],[2,2]].forEach(([str,f])=>{ const x=x0+(f-.5)*step, y=sy[str]; s+=`<circle class="dot" cx="${x}" cy="${y}" r="11" fill="#E2A55A" stroke="#1b1310" stroke-width="3"/>`; });
  $('#fret').innerHTML = s+'</svg>';
})();

const FILTERS = [
  ['all','Todo',()=>true],
  ['own','Con mis acordes',g=>g.mine],
  ['video','Con vídeo',g=>g.videos.length>0],
  ['tab','Con acordes web',g=>g.tabs.length>0],
];
const state = {q:'', f:'all', a:null};
$('#chips').innerHTML = FILTERS.map(([k,t,fn]) => `<button class="chip" data-f="${k}" aria-pressed="${k===state.f}">${t}<span class="n">${DATA.filter(fn).length}</span></button>`).join('');
$('#artists').innerHTML = `<button data-a="" aria-pressed="true"><span class="ring"><i>♪</i></span><span class="nm">Todos</span></button>` +
  Object.keys(artists).sort((a,b)=>a.localeCompare(b,'es')).map(a=>`<button data-a="${esc(a)}" aria-pressed="false" title="${esc(a)} · ${artists[a]}"><span class="ring">${avOf(a)?`<img src="${avOf(a)}" alt="" loading="lazy">`:`<i>${esc(initials(a))}</i>`}</span><span class="nm">${esc(a)}</span></button>`).join('');

const IC = {
  v:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  t:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16M9 4v16"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  res:'<svg viewBox="0 0 24 24"><path d="M4 5h11l5 5v9H4z"/><path d="M15 5v5h5"/></svg>'
};
const pic = (g,cls='av') => g.t==='recurso' ? `<div class="${cls} res" aria-hidden="true">${IC.res}</div>`
  : (avOf(g.a) ? `<div class="${cls}"><img src="${avOf(g.a)}" alt="" loading="lazy"></div>` : `<div class="${cls}" aria-hidden="true">${esc(initials(g.a||'?'))}</div>`);

function card(g){
  const f = [];
  if (g.mine) f.push(`<span class="ft mine">Mis acordes</span>`);
  g.tabs.forEach(l => f.push(`<span class="ft t">${IC.t}${esc(l.n.replace('Acordes · ','').replace('Partitura PDF · ','PDF · '))}</span>`));
  if (g.videos.length) f.push(`<span class="ft v">${IC.v}${g.videos.length>1?g.videos.length+' vídeos':'Vídeo'}</span>`);
  return `<li><a class="card" href="#${g.slug}" data-p="${g.i}" aria-label="Practicar ${esc(g.s)} de ${esc(g.a)}">
    <h4>${esc(g.s)}</h4><div class="feats">${f.join('')}</div><span class="go" aria-hidden="true">${IC.play}</span></a></li>`;
}
const artKey = a => norm(a.replace(/^(El|La|Los|Las)\s+/,''));
function visible(){
  const q = norm(state.q).split(/\s+/).filter(Boolean);
  const fn = FILTERS.find(f=>f[0]===state.f)[2];
  return DATA.filter(g => fn(g) && (!state.a || g.a===state.a) && q.every(w => g.hay.includes(w)));
}
function render(){
  const rows = visible();
  rows.sort((a,b)=> artKey(a.a).localeCompare(artKey(b.a),'es') || a.s.localeCompare(b.s,'es'));
  const groups = [];
  rows.forEach(g => { const last=groups[groups.length-1]; if (!last || last.a!==g.a) groups.push({a:g.a, items:[g]}); else last.items.push(g); });
  $('#count').textContent = `${rows.length} ${rows.length===1?'canción':'canciones'} · ${groups.length} ${groups.length===1?'artista':'artistas'}`;
  $('#sectitle').textContent = state.a || 'Canciones';
  if (!rows.length) { $('#list').innerHTML = `<p class="empty">No hay nada que coincida con la búsqueda. Prueba con otra palabra o pulsa "Todo".</p>`; return; }
  $('#list').innerHTML = groups.map(gr => { const tot = artists[gr.a]||gr.items.length;
    return `<section class="group" id="a-${norm(gr.a).replace(/\s+/g,'-')}"><div class="ahead">${pic(gr.items[0])}<h3>${esc(gr.a)}</h3><p>${tot} ${tot===1?'canción':'canciones'}</p></div><ul class="cards">${gr.items.map(card).join('')}</ul></section>`; }).join('');
  observe();
}

/* Entrada suave de tarjetas al hacer scroll (las ya visibles no se animan) */
let io;
function observe(){
  if (!('IntersectionObserver' in window)) return;
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -40px 0px'});
  const vh = innerHeight;
  document.querySelectorAll('.card').forEach(c => { if (c.getBoundingClientRect().top > vh) io.observe(c); });
}

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; state.f = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', c===b)); render(); });
$('#artists').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; state.a = b.dataset.a||null;
  document.querySelectorAll('#artists button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render();
  const top = $('.sec').getBoundingClientRect().top + scrollY - 80; if (scrollY > top || state.a) scrollTo({top, behavior:'smooth'}); });

/* Barra fija con fondo al despegarse + paralaje del diapasón */
const tools = $('#tools'), fretEl = $('#fret');
const motionOK = matchMedia('(prefers-reduced-motion: no-preference)').matches;
addEventListener('scroll', () => {
  tools.classList.toggle('stuck', tools.getBoundingClientRect().top <= 0 && scrollY > 40);
  if (motionOK && scrollY < 600) fretEl.style.transform = `translateY(${scrollY*0.25}px)`;
}, {passive:true});

/* Diagramas y contenido propio */
function chordSVG(raw){
  let label = '', s = raw;
  const m = raw.match(/^([^:]+):\s*(.*)$/); if (m) { label = m[1]; s = m[2]; }
  const f = s.trim().split(/\s+/).map(x => /x/i.test(x) ? null : +x);
  if (f.length!==6 || f.some(x=>x!==null&&isNaN(x))) return '';
  const pos = f.filter(x=>x>0), max = Math.max(0,...pos), min = pos.length?Math.min(...pos):1;
  const base = max>4 ? min : 1, W=78, H=96, x0=12, gx=(W-24)/5, y0=20, gy=15;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama ${esc(raw)}">`;
  g += base===1 ? `<rect x="${x0}" y="${y0-3}" width="${gx*5}" height="3" fill="#F4EADC"/>` : `<text x="${W-1}" y="${y0+gy/2+4}" font-size="9" text-anchor="end" fill="#B9A693">${base}</text>`;
  for (let i=0;i<=5;i++) g += `<line x1="${x0}" y1="${y0+i*gy}" x2="${x0+gx*5}" y2="${y0+i*gy}" stroke="#b98b4f" stroke-width="1"/>`;
  for (let i=0;i<6;i++) g += `<line x1="${x0+i*gx}" y1="${y0}" x2="${x0+i*gx}" y2="${y0+gy*5}" stroke="#CBCFD4" stroke-width="${1+(5-i)*.25}"/>`;
  f.forEach((v,i)=>{ const x=x0+i*gx;
    if (v===null) g += `<text x="${x}" y="${y0-7}" font-size="9" text-anchor="middle" fill="#B9A693">×</text>`;
    else if (v===0) g += `<circle cx="${x}" cy="${y0-9}" r="3" fill="none" stroke="#B9A693"/>`;
    else { const r=v-base+1; if (r>=1&&r<=5) g += `<circle cx="${x}" cy="${y0+(r-.5)*gy}" r="4.6" fill="#E2A55A"/>`; }
  });
  return `<div class="shape">${g}</svg><span>${esc(label||s)}</span></div>`;
}
function ownHTML(o){
  const p = [];
  if (o.capo) p.push(`<div class="capo">Cejilla: <b>${esc(o.capo.replace(/^(Cejilla|Capo)\s*/i,''))}</b></div>`);
  if (o.notes) p.push(`<p class="note">${esc(o.notes)}</p>`);
  if (o.chords) p.push(`<pre>${esc(o.chords)}</pre>`);
  if (o.shapes) p.push(`<div class="shapes">${o.shapes.map(chordSVG).join('')}</div>`);
  if (o.tab) p.push(`<pre>${esc(o.tab)}</pre>`);
  return p.join('');
}

/* ---- Modo práctica ---- */
const PIP_SIZES = ['240px','320px','460px'];
const pipState = { size: 1, corner: 0 };
try { Object.assign(pipState, JSON.parse(localStorage.getItem('tabs-pip')||'{}')); } catch(e) {}
const savePip = () => { try { localStorage.setItem('tabs-pip', JSON.stringify(pipState)); } catch(e) {} };
function applyPip(){ const p=$('#pip'); p.style.setProperty('--pip-w', innerWidth<760 ? ['44vw','58vw','86vw'][pipState.size] : PIP_SIZES[pipState.size]);
  p.classList.toggle('top', pipState.corner===1||pipState.corner===2); p.classList.toggle('left', pipState.corner===2||pipState.corner===3); }
let cur = null, lastFocus = null;
function sources(g){
  const s = [];
  if (g.mine || (g.own && g.own.notes && !g.tabs.length)) s.push({kind:'own', label:'Mis acordes'});
  g.tabs.forEach(l => s.push({kind: EMBEDDABLE.test(hostOf(l.u)) ? 'frame' : 'ext', label: l.n.replace('Acordes · ',''), u: l.u}));
  return s;
}
function showSource(g, i){
  const s = sources(g)[i], main = $('#p-main'), open = $('#p-open');
  document.querySelectorAll('#p-src .pbtn').forEach((b,k)=>b.setAttribute('aria-pressed', k===i));
  if (!s) { main.innerHTML = `<div class="nolink"><p>Esta canción solo tiene vídeo.</p></div>`; open.hidden = true; return; }
  if (s.kind==='own') { main.innerHTML = `<div class="ownview">${ownHTML(g.own)}</div>`; open.hidden = true; return; }
  open.hidden = false; open.href = s.u;
  if (s.kind==='frame') main.innerHTML = `<iframe class="tabframe" src="${esc(s.u)}" title="Acordes de ${esc(g.s)}" referrerpolicy="no-referrer"></iframe>`;
  else main.innerHTML = `<div class="nolink"><p>${esc(s.label)} no deja mostrar sus páginas dentro de otra web.</p><a class="cta" href="${esc(s.u)}" target="_blank" rel="noopener">Abrir en ${esc(s.label)}</a></div>`;
}
/* Reproductor de YouTube con velocidad y bucle */
let ytReady = null, player = null, loopA = null, loopB = null, loopTimer = null;
const ytApi = () => ytReady || (ytReady = new Promise((res, rej) => {
  window.onYouTubeIframeAPIReady = res;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = rej; document.head.appendChild(s);
  setTimeout(() => rej(new Error('timeout')), 10000);
}));
const fmtT = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function resetLoop(){ loopA = loopB = null; $('#loop-x').hidden = true; $('#loop-info').textContent=''; $('#loop-a').setAttribute('aria-pressed','false'); $('#loop-b').setAttribute('aria-pressed','false'); }
function setRateUI(r){ document.querySelectorAll('#vctl [data-rate]').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.rate===r)); }
function killPlayer(){ clearInterval(loopTimer); loopTimer=null; try { player && player.destroy(); } catch(e) {} player = null; resetLoop(); setRateUI(1); $('#vctl').hidden = true; }
function showVideo(g, i){
  const v = g.videos[i], box = $('#p-vid');
  document.querySelectorAll('#p-vsel button').forEach((b,k)=>b.setAttribute('aria-pressed', k===i));
  killPlayer();
  if (!v) { box.innerHTML = `<div class="novid">Sin vídeo</div>`; return; }
  if (v.ne) { box.innerHTML = `<div class="novid">Este vídeo solo se puede ver en YouTube.<a href="${esc(v.u)}" target="_blank" rel="noopener" style="color:#fff">Abrir en YouTube</a></div>`; return; }
  const id = ytId(v.u);
  box.innerHTML = '<div id="ytp"></div>';
  ytApi().then(() => {
    if (cur !== g || !document.getElementById('ytp')) return;
    player = new YT.Player('ytp', { host:'https://www.youtube-nocookie.com', videoId:id, width:'100%', height:'100%',
      playerVars:{ rel:0, playsinline:1 },
      events:{ onReady: () => { $('#vctl').hidden = false; } } });
    loopTimer = setInterval(() => { if (player && loopA!=null && loopB!=null && player.getCurrentTime && player.getCurrentTime() >= loopB) player.seekTo(loopA, true); }, 150);
  }).catch(() => {
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1" title="Vídeo de ${esc(g.s)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  });
}
$('#vctl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !player || !player.getCurrentTime) return;
  if (b.dataset.rate) { const r = +b.dataset.rate; player.setPlaybackRate(r); setRateUI(r); return; }
  const now = player.getCurrentTime();
  if (b.id==='v-back') player.seekTo(Math.max(0, (loopA!=null && loopB!=null) ? Math.max(loopA, now-5) : now-5), true);
  if (b.id==='loop-a') { loopA = now; if (loopB!=null && loopB<=loopA) loopB=null; }
  if (b.id==='loop-b') { if (loopA==null) loopA = Math.max(0, now-10); if (now>loopA) { loopB = now; player.seekTo(loopA, true); player.playVideo(); } }
  if (b.id==='loop-x') resetLoop();
  if (b.id!=='loop-x' && b.id!=='v-back') {
    $('#loop-a').setAttribute('aria-pressed', loopA!=null); $('#loop-b').setAttribute('aria-pressed', loopB!=null);
    $('#loop-x').hidden = loopA==null && loopB==null;
    $('#loop-info').textContent = loopA!=null ? (loopB!=null ? `Bucle ${fmtT(loopA)}–${fmtT(loopB)}` : `Desde ${fmtT(loopA)}…`) : '';
  }
});

function openPractice(g, from){
  killPlayer(); cur = g; if (!$("#practice").contains(document.activeElement)) lastFocus = document.activeElement;
  const pr = $('#practice');
  if (from) { const r = from.getBoundingClientRect(); pr.style.setProperty('--x', (r.left+r.width/2)+'px'); pr.style.setProperty('--y', (r.top+r.height/2)+'px'); }
  else { pr.style.setProperty('--x','50%'); pr.style.setProperty('--y','50%'); }
  $('#p-title').textContent = g.s; $('#p-who').textContent = g.a || 'Recurso';
  $('#p-av').innerHTML = pic(g);
  const src = sources(g);
  $('#p-src').innerHTML = src.length>1 ? src.map((s,i)=>`<button class="pbtn" data-i="${i}">${esc(s.label)}</button>`).join('') : '';
  $('#p-vsel').innerHTML = g.videos.length>1 ? g.videos.map((v,i)=>`<button data-v="${i}">Vídeo ${i+1}</button>`).join(' ') : '';
  $('#pip').hidden = g.videos.length===0;
  applyPip(); showSource(g,0); if (g.videos.length) showVideo(g,0);
  pr.classList.remove('closing'); pr.hidden = false; pr.classList.add('opening');
  document.body.style.overflow='hidden';
  if (location.hash !== '#'+g.slug) history.replaceState(null,'','#'+g.slug);
  $('#p-close').focus();
}
function closePractice(){
  const pr = $('#practice'); if (pr.hidden) return;
  killPlayer();
  const done = () => { pr.hidden = true; pr.classList.remove('closing'); $('#p-main').innerHTML=''; $('#p-vid').innerHTML=''; };
  pr.classList.remove('opening');
  if (motionOK) { pr.classList.add('closing'); setTimeout(done, 380); } else done();
  document.body.style.overflow='';
  history.replaceState(null,'',location.pathname+location.search); cur=null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#p-close').addEventListener('click', closePractice);
document.addEventListener('keydown', e => { if (e.key==='Escape' && cur) closePractice(); });
$('#p-src').addEventListener('click', e => { const b=e.target.closest('[data-i]'); if(b&&cur) showSource(cur,+b.dataset.i); });
$('#p-vsel').addEventListener('click', e => { const b=e.target.closest('[data-v]'); if(b&&cur) showVideo(cur,+b.dataset.v); });
$('#pip-size').addEventListener('click', () => { pipState.size=(pipState.size+1)%3; savePip(); applyPip(); });
$('#pip-move').addEventListener('click', () => { pipState.corner=(pipState.corner+1)%4; savePip(); applyPip(); });
$('#pip-min').addEventListener('click', e => { const on = $('#pip').classList.toggle('min'); e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.textContent = on ? 'Mostrar' : 'Ocultar'; });
addEventListener('resize', () => { if (cur) applyPip(); });
const activate = el => { const g = DATA[+el.dataset.p]; if (g) openPractice(g, el); };
$('#list').addEventListener('click', e => { const c=e.target.closest('.card'); if (!c || e.button!==0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return; e.preventDefault(); activate(c); });
const fromHash = () => { const h=decodeURIComponent(location.hash.slice(1)); const g=h&&DATA.find(x=>x.slug===h); if (g) openPractice(g); };
addEventListener('hashchange', fromHash);
function randomSong(){ const pool = visible().filter(g => g!==cur); const list = pool.length ? pool : DATA.filter(g=>g!==cur); return list[Math.floor(Math.random()*list.length)]; }
$('#dice').addEventListener('click', e => { const b=e.currentTarget; b.classList.remove('roll'); void b.offsetWidth; b.classList.add('roll'); const g = randomSong(); if (g) openPractice(g, b); });
$('#p-dice').addEventListener('click', () => { const g = randomSong(); if (g) openPractice(g); });
render(); fromHash();
</script>
